[package]
name = "four-arms"
version = "0.1.0"
edition = "2024"

[dependencies]
nalgebra = "0.35.0"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
quick-xml = { version = "0.40.1", features = ["serde", "serialize"] }
thiserror = { version = "2.0.18" }
rand = "0.10.1"
rerun = "0.33.0"
tracing = "0.1.44"

[[example]]
name = "ik_planner"
path = "examples/ik_planner.rs"

[[example]]
name = "rerun_planner"
path = "examples/rerun_planner.rs"

[[example]]
name = "kd_tree_ex"
path = "examples/kd_tree_ex.rs"
